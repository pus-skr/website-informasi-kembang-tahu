                <img alt="Logo KKM 14 UMC Desa Panambangan" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxrLgtSr1OF-1dK4VP8RhzoEXsCSpPxqg0VtYRa6j7-kk5hiyYMMBg4pPLas9UrtPFfC_5aZcHyJe04sTw6Vl3cqGP4YzZ1dKvCD6hwNg4LaH6Ao2fzbWDB9cBoTmObnYNw9Q0lnIrpKYuAb-AVWeN5aa04QvarVowg5Zd283Q1Nrs5H51wqLaDRY5uWcl9F0Y0PiIbdDqL-eF8ZOhltEjF4TROGsTggU2ZbPMqRcmYoafVA-sKKB-sRxWcZNHTdW55g">
              </div>
              <div class="w-12 h-12 p-1 rounded-lg bg-surface-container-low flex items-center justify-center shadow-sm hover:scale-105 transition-transform" title="Desa Panambangan">
                <img alt="Logo Desa Panambangan" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBB2WOIrXactRJLtHM6e2r8jUZhEo4OAhn5oJNmq42qHi1HERR7584f_6BGVIjq_RIz3-Rljm17w6YxucJY_Ri_qIcteTWT_00-pbjyD5GP6G6fNN-xwB7u9KHGcDnVHI5ebFbaSf55ZZ0g2MFRRCy99OorbMu29N82kL5Q2meuVuWZMiPCHPDfKExKuX5pbbq8wkkUf3djxzpbLoHewr0Ucceec2vPsAj6mPx_E3T1cY6VGEjbBon9SXW6LT-fA-T4VA">
              </div>

            <div class="text-center mb-8">
              <h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">
                Masuk Pengelola Arsip
              </h1>
              <p class="font-body-sm text-body-sm text-on-surface-variant mt-1.5">
                Sentra Kembang Tahu Desa Panambangan
              </p>
            </div>

            <form class="flex flex-col gap-5" id="login-form">
              <div class="flex flex-col gap-1.5">
                <label class="font-label-md text-label-md text-on-surface" for="username">
                  Username / ID Staf
                </label>
                <div class="relative flex items-center">
                  <span class="material-symbols-outlined absolute left-3.5 text-outline text-title-md pointer-events-none">badge</span>
                  <input class="w-full pl-11 pr-4 py-3 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md placeholder:text-outline/70 focus:outline-none focus:bg-surface-container focus:ring-1 focus:ring-primary transition-all" id="username" placeholder="admin_panambangan" required="" type="text">
                </div>
              </div>

              <div class="flex flex-col gap-1.5">
                <div class="flex items-center justify-between">
                  <label class="font-label-md text-label-md text-on-surface" for="password">
                    Kata Sandi
                  </label>
                  <a class="font-label-sm text-label-sm text-primary hover:text-on-primary-container transition-colors" href="#" onclick="alert('Informasi Akses:\nSilakan hubungi Administrator IT KKM 14 UMC atau Sekretaris Desa Panambangan untuk verifikasi akun dan reset kata sandi pengelola arsip.')">
                    Lupa sandi?
                  </a>
                </div>
                <div class="relative flex items-center">
                  <span class="material-symbols-outlined absolute left-3.5 text-outline text-title-md pointer-events-none">lock</span>
                  <input class="w-full pl-11 pr-12 py-3 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md placeholder:text-outline/70 focus:outline-none focus:bg-surface-container focus:ring-1 focus:ring-primary transition-all" id="password" placeholder="••••••••••••" required="" type="password">
                  <button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-3 p-1.5 text-outline hover:text-on-surface transition-colors focus:outline-none" id="togglePasswordBtn" onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password'; this.querySelector('span').textContent=p.type==='password'?'visibility':'visibility_off';" type="button">
                    <span class="material-symbols-outlined text-title-md" id="passwordIcon">visibility</span>
                  </button>
                </div>
              </div>
              
              <div id="login-error" class="hidden text-error font-label-sm text-center bg-error-container p-2 rounded"></div>

              <div class="flex items-center pt-0.5">
                <label class="flex items-center gap-2.5 cursor-pointer select-none">
                  <input class="w-4 h-4 rounded text-primary focus:ring-primary accent-primary bg-surface-container-low" id="rememberMe" type="checkbox">
                  <span class="font-body-sm text-body-sm text-on-surface-variant">Ingat saya di perangkat ini</span>
                </label>
              </div>

              <div class="pt-2">
                <button class="w-full flex items-center justify-center gap-2.5 py-3.5 px-6 rounded-lg bg-primary-container text-on-primary font-title-md text-title-md shadow-md hover:shadow-xl hover:bg-primary transition-all duration-200 active:scale-[0.99] cursor-pointer disabled:opacity-70 disabled:cursor-not-allowed" id="btn-login" type="submit">
                  <span id="login-spinner" class="hidden material-symbols-outlined animate-spin text-title-md">sync</span>
                  <span class="material-symbols-outlined text-title-md">login</span>
                  <span class="">Masuk ke Dashboard</span>
                </button>
              </div>
            </form>

            <p class="font-body-sm text-body-sm text-outline">
